fileVersion: 1
id: "1"
macroString: |-
  {%- macro testunique(column) -%}
  SELECT
        {{column}},
        COUNT(*)
      FROM
        {{this}}
      GROUP BY
        {{column}}
      HAVING
        COUNT(*) > 1
  {%- endmacro %}

  {%- macro testbalance(column,balance_value) -%}
  SELECT
        {{column}},
        "C_NAME"
      FROM
        {{this}}
      WHERE
        {{column}} > {{balance_value}}
  {%- endmacro %}


  {%- macro testerror(column) -%}
  SELECT
        {{column}},
        COUNT(*)
      FROM
        asdfasdf
      GROUP BY
        {{column}}
      HAVING
        COUNT(*) > 1
  {%- endmacro %}



  {%- macro ref_raw(location_name, node_name) -%}
      {%- raw -%}{{ ref('{% endraw %}{{- location_name }}{% raw %}', '{% endraw %}{{ node_name }}{% raw %}') }}{% endraw %}
  {%- endmacro -%}


  {%- macro ref_no_link_raw(location_name, node_name) -%}
      {% raw %}{{ ref_no_link('{% endraw %}{{ location_name }}{% raw %}', '{% endraw %}{{ node_name }}{% raw %}') }}{% endraw %}
  {%- endmacro -%}

  {%- macro ref_link_raw(location_name, node_name) -%}
      {% raw %}{{ ref_link('{% endraw %}{{ location_name }}{% raw %}', '{% endraw %}{{ node_name }}{% raw %}') }}{% endraw %}
  {%- endmacro -%}

  {%- macro testtoday() -%}
     CURRENT_DATE()
  {%- endmacro %}


  {%- macro expect_table_row_count_to_be_between(tablename, minValue , maxValue ,group_by = None, filterCondition = None) -%}
      {%- set tablename = tablename-%}
      {%- set minValue = minValue-%}
      {%- set maxValue = maxValue-%}
      {%- set filterCondition = filterCondition-%}
      select * from (
          select count(*) numberOfRecordActual  from {{tablename}}  
              {%- if filterCondition %}
                  Where {{filterCondition}}
              {%- endif -%}
              {%- if group_by %}
                  GROUP BY "{{ group_by | join('", "') }}"
              {%- endif -%}            
      ) table1 
      where not numberOfRecordActual between {{minValue}} and {{maxValue}}
  {%- endmacro %}
name: macro
type: Macro
