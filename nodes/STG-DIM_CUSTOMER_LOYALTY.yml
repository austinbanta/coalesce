  description: "CONTEXT\n\nThe \"DIM_CUSTOMER_LOYALTY\" table is a dimension table that provides detailed\ninformation about customer loyalty profiles. The data is sourced from the\n\"WRK_CUSTOMER_LOYALTY\" table in the EDW_PROD schema and is updated using a merge\nprocess to ensure the latest and most accurate information is available. The\ntable is maintained at the customer level, with each row representing a unique\ncustomer. It includes demographic, contact, and preference data, along with\nsystem metadata for tracking changes over time.\n\n\nUSE CASES\n\n * Analyzing customer demographics and preferences to tailor marketing\n   strategies.\n * Tracking customer loyalty program sign-ups and engagement over time.\n * Identifying customer segments based on preferences, location, and other\n   attributes.\n * Supporting customer relationship management (CRM) initiatives with detailed\n   customer profiles.\n * Enhancing personalized communication and offers based on customer data.\n\nGenerated by AI Assistant, reviewed by Glen Dawson"
