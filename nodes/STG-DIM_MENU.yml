  description: "CONTEXT\n\nThe \"DIM_MENU\" table is a dimension table that consolidates menu-related data\nfrom the \"WRK_MENU\" source table. It is designed with a Type-2 Slowly Changing\nDimension (SCD) approach, ensuring historical tracking of changes to menu\nattributes such as item categories, subcategories, and pricing. The table\nprovides granular details at the menu item level, including health metrics and\ndietary flags. Filters are applied to ensure only the most current and relevant\ndata is maintained, while historical records are preserved for analytical\npurposes.\n\n\nUSE CASES\n\n * Analyzing menu item performance across different truck brands.\n * Tracking changes in menu pricing and cost of goods over time.\n * Identifying menu items based on dietary preferences or health metrics.\n * Supporting business decisions related to menu optimization and pricing\n   strategies.\n * Providing historical insights into menu item attributes for reporting and\n   analytics.\n\nGenerated by AI Assistant, reviewed by Glen Dawson"
