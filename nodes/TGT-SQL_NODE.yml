    cteString: |
      WITH filtered_customer AS (
          SELECT
              C_CUSTKEY,
              C_NAME,
              C_ADDRESS,
              C_NATIONKEY,
              C_PHONE,
              C_ACCTBAL,
              C_MKTSEGMENT,
              C_COMMENT,
              CURRENT_DATE AS LOAD_DATE  -- Example of enrichment
          FROM {{ ref('TPCH', 'CUSTOMER') }}
          WHERE C_ACCTBAL IS NOT NULL  -- Business filter
      ),
      enriched_nation AS (
          SELECT
              N_NATIONKEY,
              N_NAME,
              N_REGIONKEY,
              N_COMMENT,
              LENGTH(N_NAME) AS NAME_LENGTH  -- Example of enrichment
          FROM {{ ref('TPCH', 'NATION') }}
      ),
      priority_calc AS (
          SELECT
              C_CUSTKEY,
              CASE
                  WHEN C_ACCTBAL > 10000 THEN 'Very High'
                  WHEN C_ACCTBAL > 5000 AND C_MKTSEGMENT = 'BUILDING' THEN 'High'
                  WHEN C_ACCTBAL BETWEEN 1000 AND 5000 THEN 'Medium'
                  ELSE 'Low'
              END AS PRIORITY
          FROM filtered_customer
      ),
      customer_region_priority AS (
          SELECT
              fc.C_CUSTKEY AS CUSTOMER_KEY,
              fc.C_NAME AS NAME,
              fc.C_ADDRESS AS ADDRESS,
              en.N_NAME AS NATION,
              fc.C_PHONE AS PHONE,
              fc.C_ACCTBAL AS ACCTBAL,
              fc.C_MKTSEGMENT AS MKTSEGMENT,
              fc.C_COMMENT AS COMMENT,
              pc.PRIORITY AS PRIORITY
          FROM filtered_customer fc
          LEFT JOIN enriched_nation en 
          ON fc.C_NATIONKEY = en.N_NATIONKEY
          LEFT JOIN priority_calc pc 
          ON fc.C_CUSTKEY = pc.C_CUSTKEY
      )
