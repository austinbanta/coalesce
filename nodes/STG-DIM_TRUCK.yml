  description: "🎯 PURPOSE\n\nThe DIM_TRUCK table serves as a dimension table in the data warehouse, providing\ndetailed information about trucks, including their attributes such as make,\nmodel, year, and geographical details. It is primarily used for analytical\npurposes, enabling users to analyze truck-related data in conjunction with other\nfact tables, such as FCT_ORDERS.\n\n\n🙋‍♀️ AUDIENCE\n\nThis table is intended for data analysts, business intelligence teams, and\noperations teams who need to analyze truck-related data for reporting,\ndecision-making, and operational insights.\n\n\n📄 CONTENT\n\n\nKEY FIELDS\n\nKey fields in this table include:\n\n * DIM_TRUCK_KEY: A unique identifier for the truck dimension record.\n * TRUCK_ID: A unique identifier for the truck.\n * MAKE: Specifies the manufacturer or brand of the truck.\n * MODEL: Specifies the model or version of the truck.\n * YEAR: Indicates the manufacturing year of the truck.\n * REGION and ISO_REGION: Represent geographical region details.\n * COUNTRY and ISO_COUNTRY_CODE: Indicate the country associated with the truck.\n * TRUCK_OPENING_DATE: The date when the truck became operational.\n * EV_FLAG: Flags whether the truck is electric or not.\n * FRANCHISE_FLAG: Flags whether the truck is associated with a franchise or\n   not.\n\n\n⚠️ GOOD TO KNOW\n\nThe table includes system-related fields such as SYSTEM_VERSION,\nSYSTEM_CURRENT_FLAG, SYSTEM_CREATE_DATE, SYSTEM_UPDATE_DATE, SYSTEM_START_DATE,\nand SYSTEM_END_DATE, which are useful for tracking the lifecycle and versioning\nof records. Additionally, the table is frequently joined with the FCT_ORDERS\ntable on the TRUCK_ID field.\n\n\n🛢 SOURCE\n\nThe data in this table is sourced from the WRK_TRUCK table in the\nAUSTIN_TEST_DB_PROD.EDW_PROD schema, as part of a Snowflake data pipeline.\n\n\n📆 DATA UPDATE FREQUENCY\n\nThe data in this table is updated through a MERGE operation, ensuring that new\nrecords are inserted and existing records are updated as needed. The exact\nfrequency of updates depends on the data pipeline schedule."
